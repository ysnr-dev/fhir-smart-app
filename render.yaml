services:
  - type: web
    name: fhir-smart-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors https://ysnr-fhir-client.onrender.com
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /launch
        destination: /launch.html
  - type: web
    name: fhir-smart-app-cds
    runtime: node
    buildCommand: npm ci && npm run build -w apps/cds
    startCommand: node apps/cds/dist/server.js
    healthCheckPath: /cds-services
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CDS_AUTH_TOKEN
        sync: false
      - key: SMART_APP_LAUNCH_URL
        sync: false
